<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger UI · Componentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/ledger.css">
<link rel="stylesheet" href="assets/live.css">
<script src="assets/ledger.js"></script>
<script src="assets/live.js"></script>
<script src="assets/act.js"></script>
<script src="assets/act2.js"></script>
<script src="assets/flow.js"></script>
<style>
/* VOICE: documentação de produto, calma e técnica, como a vitrine de um kit sério.
   IDEA: a própria vitrine do kit — cada página é o componente vivo, com prévia e código.
   PICTURE: a prévia do componente, grande, rodando com movimento, no topo de cada página.
   COLOUR and TYPE: tokens do Ledger UI (teal para dados, preto para ação), Inter + Geist Mono.
   LAYOUT: barra superior fina, índice lateral fixo, conteúdo de até 1000px com prévia/código. */
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg-page);color:var(--ink);font:15px/1.6 var(--font-sans);overflow-x:clip}
a{color:inherit;text-decoration:none}
.d-top{position:sticky;top:0;z-index:20;height:58px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg-page) 86%,transparent);backdrop-filter:blur(10px)}
.d-top .d-in{max-width:1480px;margin:0 auto;height:100%;display:flex;align-items:center;gap:22px;padding:0 24px}
.d-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.d-brand i{width:28px;height:28px;border-radius:9px;background:var(--inverse);color:var(--on-inverse);display:grid;place-items:center;font-style:normal;font-size:13px}
.d-top nav{margin-left:auto;display:flex;gap:20px;font-size:14px;font-weight:500;color:var(--ink-2)}
.d-top nav a:hover{color:var(--ink)}
.d-sbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg-panel);color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;width:200px}
.d-sbtn kbd,.d-kb{margin-left:auto;font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.d-ib{width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.d-ib:hover{background:var(--bg-hover)}
.d-ib svg,.d-sbtn svg,.d-tb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.d-me{width:28px;height:28px;border-radius:8px;background:var(--bg-selected);display:grid;place-items:center;font-size:11px;font-weight:600}
.d-wrap{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:40px;padding:0 24px}
.d-side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:28px 6px 40px 0;scrollbar-width:thin}
.d-side .d-grp{margin-top:22px}
.d-side h6{margin:0 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.d-side .d-lst{border-left:1px solid var(--line);margin-left:2px;display:flex;flex-direction:column}
.d-side .d-lst a{display:flex;align-items:center;gap:8px;padding:5px 12px;margin-left:-1px;border-left:1.5px solid transparent;font-size:14px;color:var(--ink-2)}
.d-side .d-lst a:hover{color:var(--ink)}
.d-side .d-lst a.on{border-left-color:var(--ink);color:var(--ink);font-weight:600}
.d-side .d-top-links a{display:flex;align-items:center;gap:10px;padding:5px 4px;font-size:14px;color:var(--ink-2);border-radius:8px}
.d-side .d-top-links a.on,.d-side .d-top-links a:hover{color:var(--ink)}
.d-side .d-top-links b{width:22px;height:22px;border-radius:6px;background:var(--bg-sunken);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.d-nw{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--pos-soft);color:var(--pos)}
main{padding:30px 0 80px;min-width:0}
.d-crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.d-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.d-hd h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:650;margin-right:auto}
.d-sub{margin:6px 0 18px;color:var(--muted);font-size:14px}
.d-tb{display:flex;gap:8px;align-items:center}
.d-bt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.d-bt:hover{background:var(--bg-hover)}
.d-seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg-panel)}
.d-seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.d-seg button.on{background:var(--bg-selected);color:var(--ink)}
.d-frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg-page)}
.d-frame iframe{display:block;width:100%;border:0;min-height:240px;background:var(--bg-page)}
pre.d-code{margin:0;padding:18px 20px;background:var(--bg-sunken);font:13px/1.65 var(--font-mono);overflow:auto;max-height:640px;color:var(--ink-2)}
.d-code .t{color:var(--accent-ink)}.d-code .a{color:var(--violet)}.d-code .s{color:var(--pos)}.d-code .k{color:var(--warn)}
.d-frame pre.d-code{border-radius:0}
section.d-doc{margin-top:34px}
section.d-doc h2{font-size:19px;letter-spacing:-.02em;margin:0 0 10px}
section.d-doc p{margin:0 0 12px;color:var(--ink-2);max-width:760px}
section.d-doc ul{margin:0;padding-left:20px;color:var(--ink-2)} section.d-doc li{margin:4px 0}
.d-cb{position:relative}.d-cb .d-cp{position:absolute;top:8px;right:8px}
.d-cb pre.d-code{border-radius:12px;border:1px solid var(--line)}
code{font-family:var(--font-mono);font-size:.88em;background:var(--bg-sunken);padding:1px 5px;border-radius:5px}
pre code{background:none;padding:0}
.d-api{max-width:900px}
.d-api h2,.d-api h3{font-size:16px;margin:26px 0 8px;letter-spacing:-.01em}
.d-api h3 code{font-size:14px}
.d-api p,.d-api li{color:var(--ink-2);font-size:14.5px}
.d-api pre{background:var(--bg-sunken);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.6}
.d-api table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 18px;display:block;overflow-x:auto}
.d-api th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-strong);padding:8px 10px 8px 0;white-space:nowrap}
.d-api td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.d-pn{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.d-pn a{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:12px;min-width:200px}
.d-pn a:hover{background:var(--bg-hover)} .d-pn small{color:var(--muted);font-size:12px} .d-pn a.r{text-align:right;margin-left:auto}
.d-hero{padding:26px 0 8px}
.d-hero h1{font-size:44px;letter-spacing:-.04em;line-height:1.05;margin:0 0 10px}
.d-hero p{font-size:17px;color:var(--muted);max-width:640px;margin:0}
.d-gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
.d-gridc a{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg-panel);display:flex;flex-direction:column;gap:4px}
.d-gridc a:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.d-gridc b{font-size:14.5px} .d-gridc span{font-size:12.5px;color:var(--muted);line-height:1.4}
.d-ghead{margin:30px 0 4px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.d-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.d-sw div{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-panel)}
.d-sw i{display:flex;height:54px}.d-sw i s{flex:1}.d-sw p{margin:0;padding:8px 10px;font:12px var(--font-mono);color:var(--ink-2)}
.d-fs{position:fixed;inset:0;z-index:50;background:var(--bg-page);display:none;flex-direction:column}
.d-fs.on{display:flex}.d-fs .d-bar{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.d-fs iframe{flex:1;border:0;width:100%}
.d-pal{position:fixed;inset:0;z-index:60;background:var(--bg-overlay);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.d-pal.on{display:flex}
.d-pal .d-box{width:min(560px,92vw);background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.d-pal input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);padding:0 18px;font:inherit;font-size:16px;background:none;color:var(--ink);outline:none}
.d-pal .d-res{max-height:50vh;overflow:auto;padding:6px}
.d-pal .d-res a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px}
.d-pal .d-res a span{margin-left:auto;font-size:12px;color:var(--muted)}
.d-pal .d-res a.d-hl{background:var(--bg-hover)}
.d-mbtn{display:none}
@media(max-width:900px){.d-wrap{grid-template-columns:minmax(0,1fr)}.d-side{display:none;position:fixed;top:58px;left:0;right:0;bottom:0;height:auto;background:var(--bg-page);z-index:15;padding:20px}.d-side.open{display:block}.d-mbtn{display:grid}.d-top nav{display:none}.d-sbtn{width:auto}.d-sbtn span{display:none}.d-hero h1{font-size:34px}}
@media(max-width:600px){.d-hd h1{font-size:24px}.d-tb .d-bt span{display:none}}

.d-page{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:40px;align-items:start}
.d-toc{position:sticky;top:88px;font-size:13.5px;max-height:calc(100vh - 110px);overflow:auto;scrollbar-width:thin}
.d-toc h6{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.d-toc a{display:block;padding:4px 0;color:var(--muted);line-height:1.35;cursor:pointer}
.d-toc a:hover{color:var(--ink-2)}.d-toc a.on{color:var(--ink);font-weight:500}
.d-toc .sep{height:1px;background:var(--line);margin:8px 0}
.d-ex{margin-top:46px;scroll-margin-top:80px}
.d-ex>h2{font-size:21px;letter-spacing:-.02em;margin:0 0 14px;font-weight:650}
.d-ex>h2 small{font:12px var(--font-mono);color:var(--muted);margin-left:8px;font-weight:400}
.d-exb{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg-panel)}
.d-exp{position:relative;padding:44px 28px;display:flex;justify-content:center;align-items:center;min-height:180px;overflow:auto;background:var(--bg-page)}
.d-exp>.d-in2{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.d-exp>.d-in2>*{max-width:100%}
.d-exp.wide>.d-in2{align-items:stretch}
.d-exc{border-top:1px solid var(--line);background:var(--bg-sunken);position:relative}
.d-exc .lng{display:block;padding:12px 20px 0;font:11.5px var(--font-mono);color:var(--muted)}
.d-exc pre.d-code{background:none;padding:8px 20px 18px;max-height:300px}
.d-exc.fold pre.d-code{max-height:150px;-webkit-mask:linear-gradient(#000 60%,transparent)}
.d-exc .acts{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.d-exc .acts button{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer}
.d-exc .acts button:hover{color:var(--ink)}
.d-lv{margin-top:6px;scroll-margin-top:80px}
@media(max-width:1180px){.d-page{grid-template-columns:minmax(0,1fr)}.d-toc{display:none}}
.d-tplw{position:relative;overflow:hidden;background:var(--bg-page)}
.d-tplw iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;display:block}
.d-chipl{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);color:var(--ink-2);font-size:13px;text-decoration:none}
.d-chipl:hover{color:var(--ink);background:var(--bg-hover)}
.d-plw{position:relative}
.d-plb{display:flex;gap:0;align-items:center;justify-content:center}
.d-plb i{width:9px;height:9px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--bg-page)}
.d-plm{position:absolute;right:0;top:44px;z-index:80;width:340px;padding:6px;border-radius:14px;background:var(--bg-panel);border:1px solid var(--line);box-shadow:var(--shadow-md);display:none}
.d-plm.on{display:block}
.d-palopt{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 12px;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.d-palopt:hover{background:var(--bg-hover)}.d-palopt.on{background:var(--bg-selected)}
.d-palopt .sw{display:flex;grid-column:1}.d-palopt .sw:nth-child(2){grid-row:2}
.d-palopt .sw i{width:12px;height:12px;border-radius:3px;margin-right:2px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.d-palopt b{grid-column:2;grid-row:1;font-size:14px}.d-palopt small{grid-column:2;grid-row:2;color:var(--muted);font-size:12px;line-height:1.35}
.d-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.d-pcol{border-radius:16px;padding:16px;background:var(--bg-page);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.d-phd{display:flex;align-items:center;justify-content:space-between}
.d-papply{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.d-papply.on{background:var(--inverse);color:var(--on-inverse);border-color:transparent}
.d-psky{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px 10px;font:500 11px var(--font-mono);color:var(--ink-2)}
.d-psw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.d-sw{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.d-sw:hover{border-color:var(--line-strong);background:var(--bg-hover)}
.d-sw i{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.d-sw span{display:flex;flex-direction:column;line-height:1.25;min-width:0}.d-sw b{font-size:12.5px;font-weight:600}.d-sw code{font:11px var(--font-mono);color:var(--muted)}.d-sw small{font:11px var(--font-mono);color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-pdemo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="d-top"><div class="d-in">
  <button class="d-ib d-mbtn" id="mb" aria-label="Abrir o índice"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="d-brand" href="#inicio"><i>L</i>Ledger UI</a>
  <nav><a href="#inicio">Componentes</a><a href="#novidades">Novidades</a><a href="#instalacao">Docs</a></nav>
  <button class="d-sbtn" id="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Buscar</span><kbd>⌘K</kbd></button>
  <span class="d-plw"><button class="d-ib d-plb" id="plb" aria-label="Escolher paleta" aria-haspopup="true"></button><div class="d-plm" id="plm" role="menu"></div></span><button class="d-ib" id="th" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <span class="d-me">AN</span>
</div></header>
<div class="d-wrap">
  <aside class="d-side" id="side"></aside>
  <main id="main"></main>
</div>
<div class="d-fs" id="fs"><div class="d-bar"><b id="fst"></b><span style="flex:1"></span><button class="d-bt" id="fsx">Fechar <span class="d-kb">Esc</span></button></div><iframe id="fsf" title="Prévia em tela cheia"></iframe></div>
<div class="d-pal" id="pal"><div class="d-box"><input id="pq" placeholder="Buscar componente…" aria-label="Buscar componente"><div class="d-res" id="pr"></div></div></div>
<script>

  const prev = docs[i - 1], next = docs[i + 1];
  const live = window.LedgerLive && LedgerLive.has(id);
  const toc = [];
  if (live) toc.push(['x-live', 'Experimente']);
  const body = secs.map((s, k) => {
    toc.push(['x-' + k, s.t]);
    const long = s.code.split('\n').length > 9;
    const wide = /lu-grid|lu-table|lu-tbl|grid-template-columns|lu-shell|lu-wire|lu-kanban|lu-dt/.test(s.h);
    return `<section class="d-ex" id="x-${k}"><h2>${esc(s.t)}</h2><div class="d-exb">
      <div class="d-exp${wide ? ' wide' : ''}"><div class="d-in2">${s.h}</div></div>
      <div class="d-exc${long ? ' fold' : ''}"><span class="lng">.${s.lang}</span><div class="acts">${long ? '<button data-fold>Expandir</button>' : ''}<button data-copy="${esc(s.code)}">Copiar</button></div><pre class="d-code">${hl(s.code)}</pre></div>
    </div></section>`;
  }).join('');
  toc.push(['sep']); toc.push(['x-uso', 'Uso']); if (d.notes && d.notes.length) toc.push(['x-regras', 'Regras']); if (d.api) toc.push(['x-api', 'Referência da API']);
  return `<div class="d-page"><div style="min-width:0">
  <div class="d-crumb">${esc(d.group)}</div>
  <div class="d-hd"><h1>${esc(d.name)}</h1><div class="d-tb">
    <button class="d-ib" id="cpl" aria-label="Copiar o link">${ico.copy}</button>
    <button class="d-bt" id="full">${ico.full}<span>Tela cheia</span></button>
  </div></div>
  <p class="d-sub">${esc(d.subtitle)}</p>
  <p style="color:var(--ink-2);max-width:760px;margin:0">${md(d.summary)}</p>
  ${live ? `<div class="d-lv" id="x-live">${LedgerLive.html(id)}</div>` : ''}
  ${body}
  <section class="d-doc d-ex" id="x-uso"><h2>Uso</h2><div class="d-cb"><button class="d-bt d-cp" data-copy="${esc(d.usage)}">Copiar</button><pre class="d-code">${hl(d.usage)}</pre></div></section>
  ${d.notes && d.notes.length ? `<section class="d-doc d-ex" id="x-regras"><h2>Regras</h2><ul>${d.notes.map(n => `<li>${md(n)}</li>`).join('')}</ul></section>` : ''}
  ${d.api ? `<section class="d-doc d-api d-ex" id="x-api"><h2>Referência da API</h2>${d.api}</section>` : ''}
  <div class="d-pn">${prev ? `<a href="#${prev.id}"><small>Anterior</small><b>${esc(prev.name)}</b></a>` : ''}${next ? `<a class="r" href="#${next.id}"><small>Próximo</small><b>${esc(next.name)}</b></a>` : ''}</div>
  </div><nav class="d-toc" id="toc"><h6>Nesta página</h6>${toc.map(t => t[0] === 'sep' ? '<div class="sep"></div>' : `<a data-go="${t[0]}">${esc(t[1])}</a>`).join('')}</nav></div>`;
}
async function route() {
  const id = (location.hash || '#inicio').slice(1) || 'inicio';
  side(id);
  const main = document.getElementById('main');
  let h;
  if (id === 'inicio') h = intro(false);
  else if (id === 'novidades') h = intro(true);
  else if (id === 'instalacao') h = install();
  else if (id === 'cores') h = cores();
  else if (id === 'temas') h = temas();
  else if (id.startsWith('tpl-')) h = tplPage(id);
  else h = await comp(id);
  main.innerHTML = h; scrollTo(0, 0);
  document.getElementById('side').classList.remove('open');
  const tp = TPLS.find(x => 'tpl-' + x.id === id); const nm = ALL.find(a => a.id === id) || (tp && {name: tp.name}); document.title = (nm ? nm.name + ' · ' : '') + 'Ledger UI';
  wire(id);
}
let spy = null;
function wire(id) {
  const main = document.getElementById('main');
  if (window.LedgerUI) LedgerUI.hydrate(main);
  if (window.LedgerAct) LedgerAct.mount(main, id);
  if (window.LedgerAct2) LedgerAct2.mount(main);
  if (window.LedgerFlow) LedgerFlow.mount(main);
  main.querySelectorAll('.d-exp:not(.wide) > .d-in2').forEach(w => { if ([...w.children].some(c => c.getBoundingClientRect().width < 60)) w.parentNode.classList.add('wide'); });
  document.querySelectorAll('.lv-toaster .stack').forEach(s => s.innerHTML = '');
  document.querySelectorAll('.lv-ov.open').forEach(o => o.classList.remove('open'));
  const full = document.getElementById('full');
  if (full) {
    full.onclick = () => { const fs = document.getElementById('fs'); document.getElementById('fst').textContent = (ALL.find(a => a.id === id) || {}).name || ''; document.getElementById('fsf').src = `c/${id}.html?theme=${theme}&palette=${palette}`; fs.classList.add('on'); };
    document.getElementById('cpl').onclick = e => { navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => { e.currentTarget.title = 'Copiado'; }, () => {}); };
  }
  document.querySelectorAll('[data-copy]').forEach(bt => bt.onclick = () => { if (navigator.clipboard) navigator.clipboard.writeText(bt.dataset.copy).then(() => { bt.textContent = 'Copiado'; setTimeout(() => bt.textContent = 'Copiar', 1400); }, () => {}); });
  document.querySelectorAll('[data-fold]').forEach(bt => bt.onclick = () => { const c = bt.closest('.d-exc'); c.classList.toggle('fold'); bt.textContent = c.classList.contains('fold') ? 'Expandir' : 'Recolher'; });
  main.querySelectorAll('[data-tplfs]').forEach(bt => bt.onclick = () => { const fs = document.getElementById('fs'); document.getElementById('fst').textContent = bt.dataset.n; document.getElementById('fsf').src = `t/${bt.dataset.tplfs}.html?theme=${theme}&palette=${palette}`; fs.classList.add('on'); });
  fitTpl();
  const toc = document.getElementById('toc');
  if (spy) spy.disconnect();
  if (toc) {
    toc.querySelectorAll('[data-go]').forEach(a => a.onclick = () => document.getElementById(a.dataset.go).scrollIntoView({behavior: 'smooth', block: 'start'}));
    const mark = k => toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.go === k));
    spy = new IntersectionObserver(es => { const v = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0]; if (v) mark(v.target.id); }, {rootMargin: '-70px 0px -65% 0px'});
    document.querySelectorAll('#main [id^="x-"]').forEach(s => spy.observe(s));
    const f = toc.querySelector('a'); if (f) f.classList.add('on');
  }
}
addEventListener('message', e => {
  if (e.data && e.data.tpl) { document.querySelectorAll('.d-tplw iframe').forEach(f => { if (f.contentWindow === e.source) { f.dataset.h = e.data.h; f.style.height = e.data.h + 'px'; } }); fitTpl(); return; }
  const f = document.getElementById('pf');
  if (f && e.source === f.contentWindow && e.data && e.data.h) f.style.height = Math.min(Math.max(e.data.h, 240), 9000) + 'px';
});
document.getElementById('fsx').onclick = () => { document.getElementById('fs').classList.remove('on'); document.getElementById('fsf').src = 'about:blank'; };
document.getElementById('th').onclick = () => { setTheme(theme === 'dark' ? 'light' : 'dark'); setPalette(palette); };
document.getElementById('plb').onclick = e => { e.stopPropagation(); const m = document.getElementById('plm'); m.innerHTML = palMenu(); m.classList.toggle('on'); };
document.addEventListener('click', e => { const b = e.target.closest('[data-pal]'); if (b) { setPalette(b.dataset.pal); if (b.dataset.th) { setTheme(b.dataset.th); setPalette(b.dataset.pal); } const m = document.getElementById('plm'); m.classList.remove('on'); if ((location.hash || '').slice(1) === 'temas') { const y = scrollY; route().then(() => scrollTo(0, y)); } return; } if (!e.target.closest('#plm')) document.getElementById('plm').classList.remove('on'); });
document.getElementById('mb').onclick = () => document.getElementById('side').classList.toggle('open');
const pal = document.getElementById('pal'), pq = document.getElementById('pq'), pr = document.getElementById('pr'); let sel = 0, hits = [];
function paint() { hits = ALL.filter(i => i.name.toLowerCase().includes(pq.value.toLowerCase().trim())).slice(0, 40); sel = Math.min(sel, Math.max(hits.length - 1, 0)); pr.innerHTML = hits.map((i, k) => `<a href="#${i.id}" class="${k===sel?'d-hl':''}">${esc(i.name)}<span>${esc(i.g.split(' · ')[1])}</span></a>`).join('') || '<p style="padding:12px;color:var(--muted)">Nenhum componente com esse nome.</p>'; }
function openPal() { pal.classList.add('on'); pq.value = ''; sel = 0; paint(); pq.focus(); }
document.getElementById('sb').onclick = openPal;
pal.onclick = e => { if (e.target === pal || e.target.closest('a')) pal.classList.remove('on'); };
pq.oninput = () => { sel = 0; paint(); };
pq.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, hits.length - 1); paint(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); } if (e.key === 'Enter' && hits[sel]) { location.hash = hits[sel].id; pal.classList.remove('on'); } if (e.key === 'Escape') pal.classList.remove('on'); };
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } if (e.key === 'Escape') { document.getElementById('fs').classList.remove('on'); pal.classList.remove('on'); } });
addEventListener('hashchange', route);
setTheme(theme); setPalette(palette); route();
}
</script>
