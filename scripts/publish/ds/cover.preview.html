<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ledger UI</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-page); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .tray { fill:var(--bg-tray); stroke:var(--line); }
  .brand { fill:var(--teal-500); }
  .deep { fill:var(--chart-2); }
  .ink { fill:var(--inverse); }
  .lime { fill:var(--lime-soft); }
  .tile.t6 { fill:var(--teal-600); } .tile.t4 { fill:var(--teal-400); } .tile.t2 { fill:var(--teal-200); } .tile.t1 { fill:var(--teal-100); } .tile.t0 { fill:var(--teal-50); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:600; letter-spacing:-.045em; color:var(--ink); }
  .tag { margin:12px 0 0 4px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 288" width="480" height="288">
<!--
  blocks      tray (bg-tray, radius-xl) 300x240 holding a teal-500 slab 96x184 (identity), chart-2 deep block 96x112, inverse 64x40 (the black button), lime-soft 64x24 (opportunity) — about 40% of 960x288
  arrangement the system card itself: a tray wrapping a panel, the blocks standing inside it like bars, bottoms aligned on the tray floor
  pattern     cohort-retention tiles (dense, modular UI -> tiles cut by radius-xs), teal-50..600 fading down and to the right, as in the heatmap
  scales      tray padding space-1-5 x4, gutters space-4, tile 22 + gap 4, corners radius-xl / radius-lg / radius-md / radius-xs
-->
<rect class="tray" x="500" y="24" width="440" height="248" rx="20"/>
<rect class="brand" x="524" y="72" width="96" height="176" rx="14"/>
<rect class="deep" x="524" y="40" width="96" height="24" rx="6"/>
<rect class="ink" x="524" y="40" width="40" height="24" rx="6"/>
<rect class="tile t6" x="640" y="40" width="22" height="22" rx="4"/><rect class="tile t4" x="666" y="40" width="22" height="22" rx="4"/><rect class="tile t2" x="692" y="40" width="22" height="22" rx="4"/><rect class="tile t2" x="718" y="40" width="22" height="22" rx="4"/><rect class="tile t1" x="744" y="40" width="22" height="22" rx="4"/><rect class="tile t1" x="770" y="40" width="22" height="22" rx="4"/><rect class="tile t6" x="640" y="66" width="22" height="22" rx="4"/><rect class="tile t4" x="666" y="66" width="22" height="22" rx="4"/><rect class="tile t2" x="692" y="66" width="22" height="22" rx="4"/><rect class="tile t1" x="718" y="66" width="22" height="22" rx="4"/><rect class="tile t1" x="744" y="66" width="22" height="22" rx="4"/><rect class="tile t0" x="770" y="66" width="22" height="22" rx="4"/><rect class="tile t6" x="640" y="92" width="22" height="22" rx="4"/><rect class="tile t4" x="666" y="92" width="22" height="22" rx="4"/><rect class="tile t2" x="692" y="92" width="22" height="22" rx="4"/><rect class="tile t1" x="718" y="92" width="22" height="22" rx="4"/><rect class="tile t1" x="744" y="92" width="22" height="22" rx="4"/><rect class="tile t6" x="640" y="118" width="22" height="22" rx="4"/><rect class="tile t6" x="666" y="118" width="22" height="22" rx="4"/><rect class="tile t2" x="692" y="118" width="22" height="22" rx="4"/><rect class="tile t1" x="718" y="118" width="22" height="22" rx="4"/><rect class="tile t6" x="640" y="144" width="22" height="22" rx="4"/><rect class="tile t4" x="666" y="144" width="22" height="22" rx="4"/><rect class="tile t2" x="692" y="144" width="22" height="22" rx="4"/><rect class="tile t6" x="640" y="170" width="22" height="22" rx="4"/><rect class="tile t4" x="666" y="170" width="22" height="22" rx="4"/>
<rect class="lime" x="640" y="200" width="88" height="22" rx="6"/>
<rect class="ink" x="800" y="224" width="120" height="32" rx="10"/>
<rect class="deep" x="868" y="164" width="52" height="44" rx="10"/>
</svg>
</div>
<div class="words">
<h1 class="name">Ledger<br>UI</h1>
<p class="tag">Teal para dados, preto para ação, bandejas que abraçam painéis.</p>
</div>
</div>
</body>
</html>
